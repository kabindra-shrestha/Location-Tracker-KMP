stages:
  - test
  - build
  - publish

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

before_script:
  - chmod +x gradlew

test_library:
  stage: test
  image: openjdk:21-jdk-slim # Android/Common tests can run on Linux
  script:
    - ./gradlew :location-tracker:testAndroidHostTest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build_xcframework:
  stage: build
  tags:
    - macos # Requires a macOS runner for iOS targets
  script:
    - ./gradlew :location-tracker:assemble
  artifacts:
    paths:
      - location-tracker/build/XCFrameworks/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

publish_to_gitlab:
  stage: publish
  tags:
    - macos
  script:
    - ./gradlew :location-tracker:publishAllPublicationsToGitLabRepository
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      when: manual # Safer to trigger manually for releases
